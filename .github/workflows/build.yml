name: Translate Chinese and Build APK

on:
  push:
    branches: ["**"]
    # Publishing a version tag (for example v1.10.3) also creates a GitHub Release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_translations:
        description: "Commit translated source files back to this branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Translate source and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python for translation
        uses: actions/setup-python@v7
        with:
          # Argos Translate's native dependencies have reliable wheels on Python 3.11.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-translate.txt

      - name: Cache Argos Chinese-English model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-translate-zh-en-v1-${{ runner.os }}

      - name: Restore translation cache
        uses: actions/cache/restore@v4
        with:
          path: tools/.translation-cache.json
          key: translate-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            translate-cache-${{ runner.os }}-${{ github.ref_name }}-
            translate-cache-${{ runner.os }}-

      - name: Install translation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-translate.txt

      - name: Translate Chinese text to English (offline model)
        run: python tools/translate_chinese.py --write

      - name: Save translation cache (including partial progress)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/.translation-cache.json
          key: translate-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Verify no Chinese text remains
        run: python tools/translate_chinese.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are both unset."
            exit 1
          fi
          if ! command -v android >/dev/null 2>&1; then
            echo "::error::Android CLI ('android') was not found on PATH."
            exit 1
          fi
          # setup-android already accepts Android SDK licenses. Use the current
          # Android CLI instead of deprecated sdkmanager; avoid `yes | ...`,
          # which fails under GitHub Actions' pipefail when the consumer exits.
          android --sdk="$SDK_ROOT" sdk install \
            platform-tools \
            platforms/android-34 \
            build-tools/34.0.0 \
            ndk/26.3.11579264 \
            cmake/3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Package translated source code
        shell: bash
        run: |
          zip -qr "$RUNNER_TEMP/AssetStudioMobile-translated-source.zip" . \
            -x '.git/*' \
               '.gradle/*' \
               '**/build/*' \
               '**/.cxx/*' \
               '**/.externalNativeBuild/*' \
               'local.properties' \
               'tools/.translation-cache.json' \
               'tools/.translation-cache.json.tmp' \
               '*.apk' \
               '*.aab'

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioMobile-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload translated source archive
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioMobile-translated-source
          path: ${{ runner.temp }}/AssetStudioMobile-translated-source.zip
          if-no-files-found: error
          retention-days: 14

  commit-translations:
    name: Commit translated source (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.commit_translations == true && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download translated source archive
        uses: actions/download-artifact@v8
        with:
          name: AssetStudioMobile-translated-source
          path: ${{ runner.temp }}/translated-artifact

      - name: Commit translation changes
        shell: bash
        run: |
          unzip -oq "$RUNNER_TEMP/translated-artifact/AssetStudioMobile-translated-source.zip" -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No translated changes to commit."
            exit 0
          fi
          git commit -m "chore: translate Chinese text to English [skip ci]"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Translated source committed to ${GITHUB_REF_NAME}."
          else
            echo "::warning::Could not push the translation commit. Download the translated-source artifact instead."
          fi

  publish-release:
    name: Publish APKs and source to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: AssetStudioMobile-APKs
          path: ${{ runner.temp }}/release-input/apks

      - name: Download translated source archive
        uses: actions/download-artifact@v8
        with:
          name: AssetStudioMobile-translated-source
          path: ${{ runner.temp }}/release-input/source

      - name: Prepare release files and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          APK_ROOT="$RUNNER_TEMP/release-input/apks"
          SOURCE_ROOT="$RUNNER_TEMP/release-input/source"
          DIST="$RUNNER_TEMP/release-assets"
          mkdir -p "$DIST"

          apk_count=0
          while IFS= read -r -d '' apk; do
            name="$(basename "$apk")"
            case "$name" in
              app-debug.apk)
                cp "$apk" "$DIST/AssetStudioMobile-${RELEASE_TAG}-debug.apk"
                ;;
              app-release.apk)
                cp "$apk" "$DIST/AssetStudioMobile-${RELEASE_TAG}-release.apk"
                ;;
              *)
                relative="${apk#"$APK_ROOT"/}"
                safe_name="${relative//\//-}"
                cp "$apk" "$DIST/AssetStudioMobile-${RELEASE_TAG}-${safe_name}"
                ;;
            esac
            apk_count=$((apk_count + 1))
          done < <(find "$APK_ROOT" -type f -name '*.apk' -print0)

          if [[ "$apk_count" -eq 0 ]]; then
            echo "::error::No APK files were downloaded from the build job."
            exit 1
          fi
          if [[ ! -f "$DIST/AssetStudioMobile-${RELEASE_TAG}-release.apk" ]]; then
            echo "::error::The release APK app-release.apk was not found."
            exit 1
          fi

          source_zip="$(find "$SOURCE_ROOT" -type f -name '*.zip' -print -quit)"
          if [[ -z "$source_zip" ]]; then
            echo "::error::Translated source ZIP was not found."
            exit 1
          fi
          cp "$source_zip" "$DIST/AssetStudioMobile-${RELEASE_TAG}-translated-source.zip"

          cat > "$DIST/BUILD-INFO.txt" <<EOF
          Project: AssetStudioMobile
          Release tag: ${RELEASE_TAG}
          Commit: ${COMMIT_SHA}
          Repository: https://github.com/${REPOSITORY}
          GitHub Actions run: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}
          Build assets: release APK, debug APK (if produced), translated source archive.

          Note: The release APK uses the signing configuration available to the project at build time.
          EOF

          (cd "$DIST" && sha256sum *.apk *.zip BUILD-INFO.txt > SHA256SUMS.txt)
          echo "Prepared release assets:"
          ls -lh "$DIST"

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          DIST="$RUNNER_TEMP/release-assets"
          shopt -s nullglob
          assets=("$DIST"/*.apk "$DIST"/*.zip "$DIST"/BUILD-INFO.txt "$DIST"/SHA256SUMS.txt)
          if [[ ${#assets[@]} -lt 4 ]]; then
            echo "::error::Release assets are incomplete."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing assets with this successful build."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            release_flags=(--title "AssetStudioMobile $TAG" --generate-notes --verify-tag)
            # Tags such as v1.10.3-beta.1 are published as pre-releases.
            if [[ "$TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" "${release_flags[@]}"
          fi

