name: Translate Chinese and Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_translations:
        description: "Commit translated source files back to this branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Translate source and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python for translation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-translate.txt

      - name: Install translation dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-translate.txt

      - name: Translate Chinese text to English
        run: python tools/translate_chinese.py --write

      - name: Verify no Chinese text remains
        run: python tools/translate_chinese.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug and release APKs
        run: bash ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Package translated source code
        shell: bash
        run: |
          zip -qr "$RUNNER_TEMP/AssetStudioMobile-translated-source.zip" . \
            -x '.git/*' \
               '.gradle/*' \
               '**/build/*' \
               '**/.cxx/*' \
               '**/.externalNativeBuild/*' \
               'local.properties' \
               '*.apk' \
               '*.aab'

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioMobile-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload translated source archive
        uses: actions/upload-artifact@v7
        with:
          name: AssetStudioMobile-translated-source
          path: ${{ runner.temp }}/AssetStudioMobile-translated-source.zip
          if-no-files-found: error
          retention-days: 14

  commit-translations:
    name: Commit translated source (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.commit_translations == true && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download translated source archive
        uses: actions/download-artifact@v8
        with:
          name: AssetStudioMobile-translated-source
          path: ${{ runner.temp }}/translated-artifact

      - name: Commit translation changes
        shell: bash
        run: |
          unzip -oq "$RUNNER_TEMP/translated-artifact/AssetStudioMobile-translated-source.zip" -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No translated changes to commit."
            exit 0
          fi
          git commit -m "chore: translate Chinese text to English [skip ci]"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Translated source committed to ${GITHUB_REF_NAME}."
          else
            echo "::warning::Could not push the translation commit. Download the translated-source artifact instead."
          fi
